<html>
	<head>
			<title>Insert title here</title>
			<link rel="stylesheet" type="text/css" href="custom.css" media="screen"></link>
			<script type="text/JavaScript" src="js.js"></script>
	</head>
	<body>
		<div id="divSelect">
			<label for="cmbSelectOpt" id="lblSelectOpt">Which one?</label>
			<select id="cmbSelectOpt">
				<option value="" id="optDefault"></option>
				<option value="Foods" id="optFoods">Foods</option>
				<option value="Colors" id="optColors">Colors</option>
				<option value="Subjects" id="optSubjects">Subjects</option>
			</select><br>
			<button type="button" id="btnSubmitOpt">Submit</button>
		</div>
		
		<div id="divFoods">
			<div id="divFoodsMany">
				<label for="txtFoodsMany" id="lblFoodsMany">How many foods?</label>
				<input type="number" id="txtFoodsMany"></input><br>
				<button type="button" id="btnSubmitFoodsMany">Submit</button>
			</div>
			
			<div id="divFoodsInputs">
				<label for="txtFoodsInput" id=lblFoodsInput>What food?</label>
				<input type="text" id="txtFoodsInput"></input><br>
				<button type="button" id="btnSubmitFoodsInput">Submit</button>
				<button type="button" id="btnDisplayFoods">Display</button><br>
			</div>
		</div>
		
		<div id="divColors">
			<div id="divColorsMany">
				<label for="txtColorsMany" id="lblColorsMany">How many colors?</label>
				<input type="number" id="txtColorsMany"></input><br>
				<button type="button" id="btnSubmitColorsMany">Submit</button>
			</div>
			
			<div id="divColorsInputs">
				<label for="txtColorsInput" id=lblColorsInput>What color?</label>
				<input type="text" id="txtColorsInput"></input><br>
				<button type="button" id="btnSubmitColorsInput">Submit</button>
				<button type="button" id="btnDisplayColors">Display</button><br>
			</div>
		</div>
		
		<div id="divSubjects">
			<div id="divSubjectsMany">
				<label for="txtSubjectsMany" id="lblSubjectsMany">How many subjects?</label>
				<input type="number" id="txtSubjectsMany"></input><br>
				<button type="button" id="btnSubmitSubjectsMany">Submit</button>
			</div>
			
			<div id="divSubjectsInputs">
				<label for="txtSubjectsInput" id=lblSubjectsInput>What subject?</label>
				<input type="text" id="txtSubjectsInput"></input><br>
				<button type="button" id="btnSubmitSubjectsInput">Submit</button>
				<button type="button" id="btnDisplaySubjects">Display</button><br>
			</div>
		</div>
		<div id="divDisplayOutputs">
		<label id="lblDispFoods"></label><br>
		<label id="lblDispColors"></label><br>
		<label id="lblDispSubjects"></label><br>
		</div>
	</body>
</html>
