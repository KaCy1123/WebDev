<html>
	<head>
			<title>Insert title here</title>
			<link rel="stylesheet" type="text/css" href="custom.css" media="screen"></link>
			<script type="text/JavaScript" src="JavaScript.js"></script>
	</head>
	<body>
		<label for="cmbSelectOpt" id="lblSelectOpt">Which one?</label>
		<select id="cmbSelectOpt">
			<option value="Foods">Foods</option>
			<option value="Colors">Colors</option>
			<option value="Subjects">Subjects</option>
		</select><br>
		<button type="button" id="btnSubmitOpt">Submit</button>
		
		<div id="divFoods">
			<div id="divFoodsMany">
				<label for="txtFoodsMany" id="lblFoodsMany">How many foods?</label>
				<input id="txtFoodsMany"></input><br>
				<button type="button" id="btnSubmitFoodsMany">Submit</button>
			</div>
			
			<div id="divFoodInputs">
				<label for="txtFoodsInput" id=lblFoodsInput>What food?</label>
				<input id="txtFoodsInput"></input><br>
				<button type="button" id="btnSubmitFoodsInput">Submit</button>
				<label id="lblDispFoods"></label>
			</div>
		</div>
		
		<div id="divColors">
			<div id="divColorsMany">
				<label for="txtColorsMany" id="lblColorsMany">How many colors?</label>
				<input id="txtColorsMany"></input><br>
				<button type="button" id="btnSubmitColorsMany">Submit</button>
			</div>
			
			<div id="divColorsInputs">
				<label for="txtColorsInput" id=lblColorsInput>What color?</label>
				<input id="txtColorsInput"></input><br>
				<button type="button" id="btnSubmitColorsInput">Submit</button>
				<label id="lblDispColors"></label>
			</div>
		</div>
		
		<div id="divSubjects">
			<div id="divSubjectsMany">
				<label for="txtSubjectsMany" id="lblSubjectsMany">How many subjects?</label>
				<input id="txtSubjectsMany"></input><br>
				<button type="button" id="btnSubmitSubjectsInput">Submit</button>
			</div>
			
			<div id="divSubjectsInputs"></div>
				<label for="txtSubjectsInput" id=lblSubjectsInput>What subject?</label>
				<input id="txtSubjectsInput"></input><br>
				<button type="button" id="btnSubmitSubjectsInput">Submit</button>
				<label id="lblDispSubjects"></label>
		</div>
		
	</body>
</html>
