<html>
	<head>
		<title>BMI Calculator</title>
		<link rel="stylesheet" href="bmicustom.css"></link>
		<script src="bmijs.js"></script>
	</head>
	<body>
		<a id = "returnbutton" href="health.html">Return</a>
		<h1>BMI Calculator</h1>
		<div id="weight">
			<label for="txtweight" id="lblweight">Enter your weight in pounds: </label>
			<input type="number" id="txtweight"></input>
			<button type="button" id="btnweight">Submit</button>
		</div>
		<div id="height">
			<label for="txtheight" id="lblheight">Enter your height in inches: </label>
			<input type="number" id="txtheight"></input>
			<button type="button" id="btnheight">Submit</button>
		</div>
		<div id="output">
			<label for="output" id="lbloutput"></label>
		</div>
	</body>
</html>
