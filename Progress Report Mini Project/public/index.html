<html>
<head>
	<title>Mini Project - Progress Report</title>
	<link rel="stylesheet" type="text/css" href="custom.css" media="screen"></link>
	<script type="text/JavaScript" src="JS.js"></script>
</head>
<body>
	<table id="tblFull">
		<tr>
			<th id="Header">User Information</th>
		</tr>
		<tr>
			<td id="information">Inputs marked with * are required</td>
		<tr>
		<tr id="rowfirstName">
			<td id="input"><label for="inpfirstName" id="lblfirstName">*Input your first name: </label></td>
			<td><input type="text" id="inpfirstName" autofocus></input></td>
			<td>
				<table>
					<tr>hi</tr>
				</table>
			</td>
		</tr>
		<tr id="rowmiddleInit">
			<td id="input"><label for="inpmiddleInit" id="lblmiddleInit">Input your middle initial: </label></td>
			<td><input type="text" id="inpmiddleInit"></input></td>
		</tr>
		<tr id="rowlastName">
			<td id="input"><label for="inplastName" id="lbllastName">*Input your last name: </label></td>
			<td><input type="text" id="inplastName"></input></td>
		</tr>
		<tr id="rowSLC">
			<td id="input"><label for="inpSLC" id="lblSLC">*Input your SLC: </label></td>
			<td><input type="text" id="inpSLC"></input></td>
		</tr>
		<tr id="rowgradeLevel">
			<td id="input"><label for="inpgradeLevel" id="lblgradeLevel">*Input your grade level: </label></td>
			<td><input type="number" id="inpgradeLevel"></input></td>
		</tr>
		<tr id="rowEmail">
			<td id="input"><label for="inpEmail" id="lblEmail">*Input your email: </label></td>
			<td><input type="text" id="inpEmail"></input></td>
		</tr>
		
			
		</tr>
	</table>
	<p>
	<button type="button" id="btnSubmit">Submit</button>
	</p>
	<table>
		<tr id="rowOutput">
			<td id="lblOutputFNAME"></td>
			<td id="lblOutputMINIT"></td>
			<td id="lblOutputLNAME"></td>
			<td id="lblOutputSLC"></td>
			<td id="lblOutputGRADE"></td>
			<td id="lblOutputEMAIL"></td>
		</tr>
	</table>
</body>
</html>
