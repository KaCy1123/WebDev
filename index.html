<!DOCTYPE html>
<html>
	<head>
		<title>Headings and Paragraphs</title>
		<link rel="stylesheet" type="text/css" href="customize.css"></link>
	</head>
	<body>
	<!-- br - break points in html start a new line -->
		Headings Are Important! <br>
		Search engines use the headings to index the structure and content of web pages. <br>
		Users often skim a page by its headings. <br>
		It is important to use headings to show the document structure. <br>
		<h1>Heading 1</h1>
		<h2>Heading 2</h2>
		<h3>Heading 3</h3>
		<h4>Heading 4</h4>
		<h5>Heading 5</h5>
		<h6>Heading 6</h6>
	</body>
</html>
