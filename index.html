<!-- Description: To create the frame of a calculator's functions -->
<html>
<head>
	<title>Calculator</title>
	<link rel="stylesheet" type="text/css" href="custom.css" media="screen"></link>
	<script type="text/JavaScript" src="calc.js"></script>
</head>
<body>
	<table id="Calculator">
		<tr>
			<th>Calculator</th>
		</tr>
		<tr>
			<td><label id="lblfullbtns"></label>
			<br>
			<button type="button" id="btnseven">7</button>
			<button type="button" id="btneight">8</button>
			<button type="button" id="btnnine">9</button>
			<button type="button" id="btnadd">+</button><br>

			<button type="button" id="btnfour">4</button>
			<button type="button" id="btnfive">5</button>
			<button type="button" id="btnsix">6</button>
			<button type="button" id="btnsub">-</button><br>
	
			<button type="button" id="btnone">1</button>
			<button type="button" id="btntwo">2</button>
			<button type="button" id="btnthree">3</button>
			<button type="button" id="btnmult">*</button><br>
	
			<button type="button" id="btnsign">-/+</button>
			<button type="button" id="btnzero">0</button>
			<button type="button" id="btndot">.</button>
			<button type="button" id="btndiv">/</button><br>
	
			<button type="button" id="btnequal">=</button>
			<button type="button" id="btnclear">CLEAR</button>
			</td>
		</tr>
	


	</table>
	<label id="input1"></label>
	<label id="input2"></label>
	<label id="op">.</label>
</body>
</html>
