<html>
	<head>
		<title>Calculator</title>
		<link rel="stylesheet" type="text/css" href="calculatorstyle.css"></link>
		<script type="text/JavaScript" src="calculatorjs.js"></script>
	</head>
	
	<body>
		<h1>Calculator</h1>
		<div id="output">
			<input for="output" id="txtoutput" disabled></input>
		</div>
		<div id="row0">
			<button type="button" id="btnclear">AC</button>
			<button type="button" id="btnsin">sin()</button>
			<button type="button" id="btncos">cos()</button>
			<button type="button" id="btntan">tan()</button>
		</div>
		<div id="row1">
			<button type="button" id="btndelete">del</button>
			<button type="button" id="btnsign">(-)</button>
			<button type="button" id="btndeci">%</button>
			<button type="button" id="btndivide">/</button>
		</div>
		<div id="row2">
			<button type="button" id="btnseven">7</button>
			<button type="button" id="btneight">8</button>
			<button type="button" id="btnnine">9</button>
			<button type="button" id="btntimes">x</button>
		</div>
		<div id="row3">
			<button type="button" id="btnfour">4</button>
			<button type="button" id="btnfive">5</button>
			<button type="button" id="btnsix">6</button>
			<button type="button" id="btnminus">-</button>
		</div>
		<div id="row4">
			<button type="button" id="btnone">1</button>
			<button type="button" id="btntwo">2</button>
			<button type="button" id="btnthree">3</button>
			<button type="button" id="btnplus">+</button>
		</div>
		<div id="row2">
			<button type="button" id="btnzero">0</button>
			<button type="button" id="btndot">.</button>
			<button type="button" id="btnequal">=</button>
		</div>
	</body>
</html>
